<!doctype html> 
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Snake</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101820; color: #eef; font: 16px system-ui, sans-serif; }
		.game { width: min(92vw, 520px); text-align: center; }
		h1 { margin: 0 0 8px; color: #6ee7a0; }
		.bar { display: flex; justify-content: space-between; margin: 0 4px 10px; }
		canvas { width: 100%; aspect-ratio: 1; display: block; border: 3px solid #31586b; border-radius: 8px; background: #182b35; }
		button { margin-top: 14px; padding: 10px 22px; border: 0; border-radius: 6px; background: #37b875; color: #062414; font-weight: 700; cursor: pointer; }
		p { margin: 10px 0 0; color: #b8c9d0; font-size: .9rem; }
	</style>
</head>
<body>
	<main class="game">
		<h1>Snake</h1>
		<div class="bar"><span>Score: <b id="score">0</b></span><span id="status">Playing</span></div>
		<canvas id="board" width="400" height="400" aria-label="Snake game"></canvas>
		<button id="restart">Restart</button>
		<p>Use arrow keys or WASD to move. Press Space to restart.</p>
	</main>
	<script>
		const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
		const scoreEl = document.getElementById('score'), statusEl = document.getElementById('status');
		const cells = 20, size = canvas.width / cells;
		let snake, food, direction, nextDirection, score, timer, running;

		function randomFood() {
			do food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
			while (snake.some(part => part.x === food.x && part.y === food.y));
		}
		function start() {
			snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
			direction = nextDirection = { x: 1, y: 0 }; score = 0; running = true;
			scoreEl.textContent = score; statusEl.textContent = 'Playing'; randomFood();
			clearInterval(timer); timer = setInterval(tick, 115); draw();
		}
		function tick() {
			direction = nextDirection;
			const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
			if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells || snake.some(p => p.x === head.x && p.y === head.y)) return end();
			snake.unshift(head);
			if (head.x === food.x && head.y === food.y) { score++; scoreEl.textContent = score; randomFood(); } else snake.pop();
			draw();
		}
		function end() { running = false; clearInterval(timer); statusEl.textContent = 'Game over'; draw(); }
		function draw() {
			ctx.fillStyle = '#182b35'; ctx.fillRect(0, 0, canvas.width, canvas.height);
			ctx.fillStyle = '#ff6b6b'; ctx.fillRect(food.x * size + 3, food.y * size + 3, size - 6, size - 6);
			snake.forEach((part, i) => { ctx.fillStyle = i ? '#37b875' : '#8ff0b5'; ctx.fillRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4); });
			if (!running) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Game Over', 200, 190); ctx.font = '16px system-ui'; ctx.fillText('Press Restart or Space', 200, 220); }
		}
		document.addEventListener('keydown', e => {
			const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
			if (e.code === 'Space') return start();
			const move = keys[e.key]; if (!move) return;
			e.preventDefault(); if (move[0] !== -direction.x || move[1] !== -direction.y) nextDirection = { x: move[0], y: move[1] };
		});
		document.getElementById('restart').addEventListener('click', start); start();
	</script>
</body>
</html>
